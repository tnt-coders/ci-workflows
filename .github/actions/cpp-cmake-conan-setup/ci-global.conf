# Machine-level Conan policy for CI runners, provisioned into the job's CONAN_HOME by the
# cpp-cmake-conan-setup action. Runners are ephemeral and sudo-capable, so Conan may install
# the system packages that */system recipes declare instead of failing in the default check
# mode. This file never applies outside CI.
tools.system.package_manager:mode=install
tools.system.package_manager:sudo=True
