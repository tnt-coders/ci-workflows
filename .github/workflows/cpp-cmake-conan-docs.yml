name: C++ CMake Conan Docs

# Self-contained docs pipeline: pre-commit hygiene gates generation, and publication to GitHub
# Pages happens here because actions/deploy-pages can only deploy an artifact uploaded by its
# own run. Docs get their own caller workflow (and badge) since a documentation failure is a
# different signal than a platform build failure.

on:
  workflow_call:
    inputs:
      install-juce-dependencies:
        type: boolean
        default: false

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  docs:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      # Bootstrap this repo's own tooling at the exact commit this reusable workflow resolved
      # to, so a pinned consumer is frozen end-to-end and releases need no ref rewriting. The
      # guard exists because an empty ref would make checkout silently grab the default branch.
      - name: Resolve ci-workflows tooling ref
        shell: bash
        run: |
          if [[ -z "${{ github.job_workflow_sha }}" ]]; then
            echo "error: github.job_workflow_sha is empty; cannot pin the ci-workflows tooling checkout." >&2
            exit 1
          fi

      - name: Checkout ci-workflows tooling
        uses: actions/checkout@v4
        with:
          repository: tnt-coders/ci-workflows
          ref: ${{ github.job_workflow_sha }}
          path: .ci-workflows

      - name: Setup
        uses: ./.ci-workflows/.github/actions/cpp-cmake-conan-setup
        with:
          install-juce-dependencies: ${{ inputs.install-juce-dependencies }}

      - name: Install docs tools (Linux)
        shell: bash
        run: |
          sudo apt-get install -y doxygen graphviz

      - name: Configure
        run: cmake --preset release

      - name: Build docs
        run: cmake --build --preset release --target docs

      - name: Verify docs output
        shell: bash
        run: |
          test -d build/release/docs/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/release/docs/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/release/docs/html

  # Docs publish on master pushes until the first stable tag exists, then only on the latest
  # stable tag, so the published site tracks the newest release rather than tip-of-master.
  check-publish:
    runs-on: ubuntu-latest
    outputs:
      publish-docs: ${{ steps.check.outputs.publish-docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check if docs should publish
        id: check
        shell: bash
        run: |
          LATEST=$(git tag --list 'v*' | sort -V | awk '!/-/' | tail -1)
          if [[ -z "$LATEST" ]]; then
            # No stable tags — publish on master push
            if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
              echo "publish-docs=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish-docs=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Stable tags exist — only publish if this push is the latest stable tag
            if [[ "$GITHUB_REF" == "refs/tags/$LATEST" ]]; then
              echo "publish-docs=true" >> "$GITHUB_OUTPUT"
            else
              echo "publish-docs=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  publish-pages:
    if: needs.check-publish.outputs.publish-docs == 'true'
    needs: [docs, check-publish]
    runs-on: ubuntu-latest

    concurrency:
      group: github-pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
