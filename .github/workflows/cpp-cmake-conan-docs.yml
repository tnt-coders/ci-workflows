name: C++ CMake Conan Docs

# Self-contained docs pipeline: pre-commit hygiene gates generation, and publication to GitHub
# Pages happens here because actions/deploy-pages can only deploy an artifact uploaded by its
# own run. Docs get their own caller workflow (and badge) since a documentation failure is a
# different signal than a platform build failure.

on:
  workflow_call:
    inputs:
      install-juce-dependencies:
        type: boolean
        default: false

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml

  docs:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bootstrap this repo's own tooling at the exact commit this reusable workflow resolved
      # to, so a pinned consumer is frozen end-to-end and releases need no ref rewriting. The
      # sentinel fallback makes checkout fail loudly if the context is ever empty (an empty ref
      # would silently grab the default branch), and the source checkout must come first:
      # checking out into a not-yet-a-repo directory wipes it, tooling included.
      - name: Checkout ci-workflows tooling
        uses: actions/checkout@v4
        with:
          repository: tnt-coders/ci-workflows
          ref: ${{ job.workflow_sha || 'error-job-workflow-sha-unavailable' }}
          path: .ci-workflows

      - name: Setup
        uses: ./.ci-workflows/.github/actions/cpp-cmake-conan-setup
        with:
          install-juce-dependencies: ${{ inputs.install-juce-dependencies }}

      # The setup action installs Doxygen; Graphviz draws the diagrams of a project whose Doxyfile
      # sets HAVE_DOT.
      - name: Install Graphviz
        shell: bash
        run: |
          sudo apt-get install -y graphviz

      - name: Configure
        run: cmake --preset release

      - name: Build docs
        run: cmake --build --preset release --target docs

      - name: Verify docs output
        shell: bash
        run: |
          test -d build/release/docs/html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-html
          path: build/release/docs/html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/release/docs/html

  # Docs publish on master pushes until the first stable tag exists, then only on the latest
  # stable tag, so the published site tracks the newest release rather than tip-of-master. A
  # repository without GitHub Pages (a private one on a free plan cannot have it) builds its docs
  # and publishes nothing: its Pages setting is the one statement of whether it has a site.
  check-publish:
    runs-on: ubuntu-latest
    outputs:
      publish-docs: ${{ steps.check.outputs.publish-docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check if docs should publish
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(git tag --list 'v*' | sort -V | awk '!/-/' | tail -1)
          if [[ -z "$LATEST" ]]; then
            # No stable tags — publish on master push
            [[ "$GITHUB_REF" == "refs/heads/master" ]] && publish=true || publish=false
          else
            # Stable tags exist — only publish if this push is the latest stable tag
            [[ "$GITHUB_REF" == "refs/tags/$LATEST" ]] && publish=true || publish=false
          fi
          # Only a 404 means "no Pages"; any other failure stops the job.
          if [[ "$publish" == true ]] && ! pages=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1); then
            if [[ "$pages" != *"HTTP 404"* ]]; then
              echo "$pages"
              exit 1
            fi
            echo "::notice::GitHub Pages is not enabled for this repository; the docs are not published."
            publish=false
          fi
          echo "publish-docs=$publish" >> "$GITHUB_OUTPUT"

  publish-pages:
    if: needs.check-publish.outputs.publish-docs == 'true'
    needs: [docs, check-publish]
    runs-on: ubuntu-latest

    concurrency:
      group: github-pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v4
